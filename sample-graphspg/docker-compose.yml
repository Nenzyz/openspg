version: '3.8'

services:
  # Memgraph database
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: graphspg-memgraph
    ports:
      - "7687:7687"  # Bolt protocol
      - "3000:3000"  # Memgraph Lab UI
      - "7444:7444"  # Memgraph Lab secure
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
      - memgraph_etc:/etc/memgraph
    environment:
      - MEMGRAPH_LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7687"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GraphSPG API
  graphspg-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphspg-api
    ports:
      - "8000:8000"
    environment:
      - MEMGRAPH_URI=bolt://memgraph:7687
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=false
    depends_on:
      memgraph:
        condition: service_healthy
    volumes:
      - ./graphspg:/app/graphspg
      - ./examples:/app/examples
    command: uvicorn graphspg.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  memgraph_data:
  memgraph_log:
  memgraph_etc:
