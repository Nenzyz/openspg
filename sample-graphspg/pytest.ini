[pytest]
# Pytest configuration for GraphSPG

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    memgraph: tests that require a running Memgraph instance
    integration: integration tests
    slow: slow running tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Paths
testpaths = tests

# Minimum Python version
minversion = 3.10

# Custom options
[tool:pytest]
memgraph_uri = bolt://localhost:7687
