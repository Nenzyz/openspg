[tool.poetry]
name = "graphspg"
version = "0.1.0"
description = "A simplified graph processing system inspired by OpenSPG, using Memgraph"
authors = ["GraphSPG Team"]
readme = "README.md"
packages = [{include = "graphspg"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
neo4j = "^5.16.0"  # Memgraph is Neo4j-compatible
httpx = "^0.26.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
